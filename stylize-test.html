<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Nano Banana 2 — HAPPI-EL PhotoRevive</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#0f1420;color:#eef2f7}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#9aa7bd;margin-top:0}
  .box{background:#1a2233;border:1px solid #2a3550;border-radius:14px;padding:16px;margin:14px 0}
  label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
  textarea{width:100%;min-height:110px;background:#0f1420;color:#eef2f7;border:1px solid #2a3550;border-radius:10px;padding:10px;font-size:13px;box-sizing:border-box}
  input[type=file]{display:block;width:100%}
  button{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;margin-top:12px;cursor:pointer}
  button:disabled{opacity:.5}
  .statut{margin-top:12px;font-size:14px;white-space:pre-wrap}
  .ok{color:#4ade80}
  .err{color:#f87171}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .grille figure{margin:0}
  .grille img{width:100%;border-radius:10px;display:block;background:#000}
  .grille figcaption{font-size:12px;color:#9aa7bd;margin-top:4px;text-align:center}
  a.dl{display:inline-block;margin-top:10px;color:#4ade80;font-size:13px}
</style>
</head>
<body>
  <h1>🍌 Test isolé — restylage studio (Nano Banana 2)</h1>
  <p class="sub">Page indépendante de l'app principale. Sert uniquement à valider l'appel à l'API avant intégration.</p>

  <div class="box">
    <label>1. Choisir une photo</label>
    <input type="file" id="f" accept="image/*">
  </div>

  <div class="box">
    <label>2. Instruction de style (modifiable)</label>
    <textarea id="p">Transform this portrait into a professional studio photograph, in the style of a high-end editorial headshot:
- Replace the background with a smooth, softly textured neutral gray studio backdrop
- Add dramatic, professional studio lighting (soft key light with gentle directional shadow)
- Render skin with natural, sharp, realistic texture and visible pores — never smooth, plastic, or airbrushed
- Keep the person's facial identity, facial structure, expression, skin tone, hairstyle and clothing EXACTLY as in the original photo — do not change who they are or their features
- Photorealistic, high resolution, magazine-quality color grading, warm and rich tones
Do not add any text, watermark, or logo to the image.</textarea>
  </div>

  <button id="go">Lancer le test</button>
  <div class="statut" id="statut"></div>

  <div class="grille" id="grille" style="display:none">
    <figure><img id="imgAvant"><figcaption>Avant</figcaption></figure>
    <figure><img id="imgApres"><figcaption>Après (Nano Banana 2)</figcaption></figure>
  </div>
  <a class="dl" id="dl" style="display:none" download="resultat-nanobanana2.png">⬇️ Télécharger le résultat</a>

<script>
const f = document.getElementById('f');
const go = document.getElementById('go');
const statut = document.getElementById('statut');
const grille = document.getElementById('grille');
const imgAvant = document.getElementById('imgAvant');
const imgApres = document.getElementById('imgApres');
const dl = document.getElementById('dl');

function toBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

go.onclick = async () => {
  const file = f.files[0];
  if (!file) { statut.textContent = "Choisis d'abord une photo."; return; }
  go.disabled = true;
  statut.className = 'statut';
  statut.textContent = "Envoi à Nano Banana 2… (peut prendre 10–30 s)";
  grille.style.display = 'none';
  dl.style.display = 'none';

  const t0 = performance.now();
  try {
    const b64 = await toBase64(file);
    imgAvant.src = 'data:' + file.type + ';base64,' + b64;

    const resp = await fetch('/api/stylize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-access-token': 'jL5Uoboq9Ftxspv_kOHhfetRHp2Gsmd5' },
      body: JSON.stringify({ image: b64, mimeType: file.type || 'image/jpeg', prompt: document.getElementById('p').value })
    });
    const data = await resp.json();
    const dt = ((performance.now() - t0) / 1000).toFixed(1);

    if (!data.ok) {
      statut.className = 'statut err';
      statut.textContent = "❌ Échec (" + dt + "s)\nErreur : " + data.erreur + (data.detail ? "\nDétail : " + data.detail : "") + (data.statut ? "\nStatut HTTP : " + data.statut : "");
      return;
    }

    const url = 'data:' + data.mimeType + ';base64,' + data.image;
    imgApres.src = url;
    grille.style.display = 'grid';
    dl.href = url;
    dl.style.display = 'inline-block';
    statut.className = 'statut ok';
    statut.textContent = "✅ Réussi en " + dt + "s";
  } catch (e) {
    statut.className = 'statut err';
    statut.textContent = "❌ Erreur réseau/JS : " + (e && e.message || e);
  } finally {
    go.disabled = false;
  }
};
</script>
</body>
</html>
