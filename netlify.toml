[build]
  publish = "."
  functions = "."
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://snap.licdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.cm https://px.ads.linkedin.com https://www.linkedin.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.cm https://ad.doubleclick.net https://www.google-analytics.com https://region1.google-analytics.com https://px.ads.linkedin.com; font-src 'self' data:; media-src 'self'; object-src 'none'; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/careflow.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/careflow-securite.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Ancienne copie de la page BTP-Immobilier : redirection permanente vers la page de référence (conserve le référencement).
[[redirects]]
  from = "/sales-operating-system-btp-immobilier-cameroun-1"
  to = "/sales-operating-system-btp-immobilier-cameroun"
  status = 301
  force = true

[[redirects]]
  from = "/sales-operating-system-btp-immobilier-cameroun-1.html"
  to = "/sales-operating-system-btp-immobilier-cameroun"
  status = 301
  force = true
